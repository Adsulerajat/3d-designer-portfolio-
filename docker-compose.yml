version: "3.8"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/portfolio
      SITE_PASSWORD: "changeme"
      NODE_ENV: production
      PORT: 5000
    depends_on:
      - db
    ports:
      - "5000:5000"

volumes:
  db-data:
